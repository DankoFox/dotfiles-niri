# ~/.config/fuzzel/fuzzel.ini (Medium Contrast + Enhancements)
font=JetBrainsMono Nerd Font:size=12
prompt="> "
lines=12
width=40
fuzzy=yes
icons-enabled=yes
icon-theme=hicolor
terminal=kitty -e
exit-on-keyboard-focus-loss=yes

[colors]
background=282828dd
text=ebdbb2ff
match=fabd2fff
selection=3c3836ff
selection-text=83a598ff
selection-match=fabd2fff
border=665c54ff

[border]
width=2
radius=10
