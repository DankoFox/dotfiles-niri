# ~/.config/hypr/hyprlock.conf
# Hyprlock configuration matching Gruvbox Dark Soft palette with Iosevka Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    # Image commented out as requested
    # path = ~/.config/hypr/wallpapers/moon-over-mondstat.jpg

    # Gruvbox Dark background (#282828)
    color = rgba(40, 40, 40, 0.95)

    # GPU-accelerated live blur & vignette effects
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME (Clock: %I:%M %p)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgb(235, 219, 178) # Gruvbox fg (#ebdbb2)
    font_size = 64
    font_family = Iosevka Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# DATE (%a, %B %e)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%a, %B %e")"
    color = rgb(168, 153, 132) # Gruvbox fg4 (#a89984)
    font_size = 20
    font_family = Iosevka Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 260, 52
    outline_thickness = 3
    dots_size = 0.25 # Scale of dots (0.2 - 0.8)
    dots_spacing = 0.2 # Scale of spacing between dots
    dots_center = true
    dots_rounding = -1 # -1 default circle

    # Gruvbox styling
    outer_color = rgb(60, 56, 54)        # Gruvbox bg2 (#3c3836)
    inner_color = rgb(40, 40, 40)        # Gruvbox bg0 (#282828)
    font_color = rgb(235, 219, 178)       # Gruvbox fg (#ebdbb2)
    font_family = Iosevka Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##a89984">Password...</span>
    hide_input = false
    rounding = -1 # Pill shape

    # State colors
    check_color = rgb(131, 165, 152)     # Gruvbox Blue/Aqua (#83a598)
    fail_color = rgb(251, 73, 52)        # Gruvbox Red (#fb4934)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300

    capslock_color = rgb(254, 128, 25)   # Gruvbox Orange (#fe8019)
    numlock_color = -1
    bothlock_color = -1

    position = 0, -40
    halign = center
    valign = center
}
