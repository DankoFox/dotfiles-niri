# ==============================================================================
# Hypridle Configuration for Niri Compositor
# ==============================================================================
# Companion daemon to hyprlock for idle timeouts and power management.
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock               # Prevent spawning multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session            # Lock screen before suspend/sleep
    after_sleep_cmd = niri msg action power-on-monitors # Wake monitors after resume
    ignore_dbus_inhibit = true                          # Niri owns org.freedesktop.ScreenSaver D-Bus interface
}

# 1. Dim display backlight after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10% || true       # Save brightness and dim to 10% (safe on desktops)
    on-resume = brightnessctl -r || true                # Restore saved brightness
}

# 2. Lock session via hyprlock after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session                  # Trigger lock_cmd
}

# 3. Turn off display monitors via Niri IPC after 6 minutes (360s)
listener {
    timeout = 360
    on-timeout = niri msg action power-off-monitors     # Put monitors to sleep / DPMS standby
    on-resume = niri msg action power-on-monitors       # Wake monitors on activity
}

# 4. System suspend after 30 minutes (1800s)
listener {
    timeout = 1800
    on-timeout = systemctl suspend                      # Put system into sleep
}
